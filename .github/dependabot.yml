# Generated by cntxt-infra-tools compliance/git/handle_github.py
# Standard: infra/devsecops/dependabot/RULES.md
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip)"
    groups:
      pip-security:
        applies-to: "security-updates"
        patterns: ["*"]
      pip-patch-minor:
        applies-to: "version-updates"
        update-types: ["patch", "minor"]
        patterns: ["*"]
